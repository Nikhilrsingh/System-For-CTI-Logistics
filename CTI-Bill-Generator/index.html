<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bill Generator - currently under development.">
  <title>Bill Generator | CTI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #11131a;
      background: #f6f7fb;
    }
    .card {
      width: min(620px, 100%);
      padding: 48px 38px;
      text-align: center;
      background: #fff;
      border: 1px solid #e4e7ee;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(16,24,40,.10);
    }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      color: #fff;
      background: #151d76;
      font-size: 32px;
    }
    h1 { margin: 0 0 14px; color: #151d76; font-size: 34px; }
    .badge {
      display: inline-block;
      margin-bottom: 18px;
      padding: 7px 12px;
      border-radius: 999px;
      color: #124973;
      background: #edf4f9;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    p { margin: 0 auto 26px; max-width: 500px; color: #687080; line-height: 1.65; }
    a {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 10px;
      color: #fff;
      background: #151d76;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">▤</div>
    <div class="badge">Coming Soon</div>
    <h1>Bill Generator</h1>
    <p>
      Abhi Bana Nhi Hai, Work In Progress💡🧠
    </p>
    <a href="../index.html">← Back to Document Tools</a>
  </main>
</body>
</html>
